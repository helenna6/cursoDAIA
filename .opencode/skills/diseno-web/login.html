<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card" aria-labelledby="loginTitle">
      <h2 id="loginTitle">Iniciar sesión</h2>
      <form class="login-form" id="loginForm" novalidate>
        <div class="login-field">
          <label for="loginEmail">Correo electrónico</label>
          <input
            type="email"
            id="loginEmail"
            name="email"
            autocomplete="email"
            required
            placeholder="tucorreo@ejemplo.com"
            minlength="5"
          >
        </div>
        <div class="login-field password-field">
          <label for="loginPassword">Contraseña</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="loginPassword"
              name="password"
              autocomplete="current-password"
              required
              placeholder="••••••••"
              minlength="8"
            >
            <button
              type="button"
              class="btn-toggle-password"
              id="togglePassword"
              aria-label="Mostrar contraseña"
            >
              <span class="toggle-icon" aria-hidden="true">👁️</span>
            </button>
          </div>
        </div>
        <div class="login-message" id="loginError" role="alert" aria-live="polite" hidden></div>
        <div class="btn-group">
          <button type="submit" class="btn-login" id="loginBtn">Iniciar sesión</button>
        </div>
        <button type="button" class="btn-close" id="loginClose">Cerrar</button>
      </form>
    </section>
    <button class="btn-login-open" id="loginOpenBtn">Iniciar sesión</button>
  </main>
  <script src="login.js" type="module"></script>
</body>
</html>
